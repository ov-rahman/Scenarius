name: Сборка приложения для Pages

on:
  push:
    branches: [main]
    # Собранный файл коммитится этим же процессом — не гоняем сборку по кругу.
    paths-ignore:
      - index.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # Одним самодостаточным файлом: Pages настроен на выдачу файлов ветки,
      # и отдельные ресурсы в подпапках он бы не отдал по нужным путям.
      - run: pnpm bundle
        working-directory: app

      - name: Обновить index.html в корне
        run: |
          cp app/dist/scenarius.html index.html
          if git diff --quiet index.html; then
            echo "Приложение не изменилось — коммит не нужен"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Пересобрать приложение для Pages"
          git push
